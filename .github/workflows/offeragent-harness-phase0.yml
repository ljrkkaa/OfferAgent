name: OfferAgent Harness Phase 0

on:
  pull_request:
    paths:
      - "packages/offeragent-harness/**"
      - "docs/architecture/**"
      - "src/interface/obsidian/src/**"
      - ".github/workflows/offeragent-harness-phase0.yml"
  push:
    paths:
      - "packages/offeragent-harness/**"
      - "docs/architecture/**"
      - "src/interface/obsidian/src/**"

jobs:
  harness:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/offeragent-harness
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src tests
      - run: uv run lint-imports --config .importlinter --no-cache
      - run: uv run python -m offeragent_harness.protocol.schemas check
      - run: uv run python scripts/check_architecture.py
      - run: uv run python scripts/check_forbidden_dependencies.py
      - run: uv run semgrep scan --config semgrep.yml --error src ../../src/interface/obsidian/src
      - run: uv build

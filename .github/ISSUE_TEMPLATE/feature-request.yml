name: Feature request
description: Propose an OfferAgent product capability
labels: [upgrade]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the user need without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain the observable behavior that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Safety and scope constraints
      description: Note any Vault, permission, recovery, privacy, or compatibility constraints.
    validations:
      required: false

name: Bug report
description: Report a reproducible OfferAgent problem
labels: [fix]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: OfferAgent, Obsidian, Node.js, and Windows versions.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Do not include credentials or complete Vault files.
    validations:
      required: false

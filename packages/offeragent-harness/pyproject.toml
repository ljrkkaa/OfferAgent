[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "offeragent-harness"
version = "0.1.0a0"
description = "Windows-local, provider-neutral OfferAgent Harness core and runtime"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "OfferAgent contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "anyio>=4.8,<5",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
  "typing-extensions>=4.12,<5; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.120,<7",
  "import-linter>=2.2,<3",
  "mypy>=1.15,<2",
  "packaging>=24,<26",
  "pyinstaller>=6.14,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
offeragent-harness = "offeragent_harness.cli:main"
offeragent-protocol-schema = "offeragent_harness.protocol.schemas:main"

[tool.hatch.build.targets.wheel]
packages = ["src/offeragent_harness"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "offeragent_harness/_schema"
"web/index.html" = "offeragent_harness/_web/index.html"
"web/assets" = "offeragent_harness/_web/assets"

[tool.hatch.build.targets.sdist]
include = ["src/offeragent_harness", "schema", "web/index.html", "web/assets", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
packages = ["offeragent_harness"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

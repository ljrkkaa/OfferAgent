rules:
  - id: harness-no-legacy-runtime-imports
    message: The local Harness must not import Khoj, Django, PostgreSQL, Router, or LangChain runtime code.
    severity: ERROR
    languages: [python]
    paths:
      include:
        - "**/offeragent_harness/**/*.py"
    pattern-regex: '^\s*(from|import)\s+(khoj|django|psycopg2?|langchain)(\.|\s|$)'

  - id: model-provider-no-process-or-filesystem
    message: A ModelGateway adapter cannot own filesystem or process execution.
    severity: ERROR
    languages: [python]
    paths:
      include:
        - "**/offeragent_harness/models/**/*.py"
    pattern-either:
      - pattern: subprocess.$F(...)
      - pattern: os.system(...)
      - pattern: pathlib.Path(...).write_text(...)
      - pattern: pathlib.Path(...).write_bytes(...)

  - id: obsidian-no-direct-model-sdk
    message: Obsidian UI must not invoke a model provider directly.
    severity: ERROR
    languages: [typescript]
    paths:
      include:
        - "**/interface/obsidian/src/**/*.ts"
    pattern-regex: >-
      (from|require\()\s*['"](openai|@anthropic-ai/sdk|@openai/)

  - id: obsidian-no-agent-loop
    message: Obsidian UI must not implement a model-tool-model loop.
    severity: ERROR
    languages: [typescript]
    paths:
      include:
        - "**/interface/obsidian/src/**/*.ts"
    patterns:
      - pattern-inside: |
          while ($COND) {
            ...
          }
      - pattern-regex: '(model|planner).*(tool|call)|(tool|call).*(model|planner)'

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>OfferAgent 本地 Web</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="app" aria-live="polite">
    <header class="topbar">
      <div class="brand"><span class="mark">O</span><span>OfferAgent</span><span class="local">本地</span></div>
      <nav>
        <button id="new-session" type="button">新会话</button>
        <button id="memory" type="button">Memory</button>
        <button id="capabilities" type="button">能力</button>
        <button id="diagnostics" type="button">诊断</button>
      </nav>
    </header>
    <main class="layout">
      <aside class="sidebar">
        <h2>会话</h2>
        <div id="sessions" class="sessions"></div>
      </aside>
      <section class="conversation">
        <div class="conversation-head">
          <div id="status" class="status">正在验证本地 Worker…</div>
          <div class="session-actions" aria-label="当前会话操作">
            <button id="rename-session" type="button" disabled>重命名</button>
            <button id="compact-session" type="button" disabled>压缩</button>
            <button id="delete-session" type="button" disabled>删除</button>
          </div>
        </div>
        <div id="timeline" class="timeline"></div>
        <form id="composer" class="composer">
          <div class="run-config">
            <label>模型
              <select id="model" aria-label="模型" disabled></select>
            </label>
            <button id="model-health" type="button" disabled>检查模型</button>
            <span id="model-status" class="control-status" aria-live="polite">正在读取模型目录…</span>
            <label>推理
              <select id="reasoning" aria-label="推理强度">
                <option value="low">低</option>
                <option value="medium" selected>中</option>
                <option value="high">高</option>
              </select>
            </label>
          </div>
          <section id="headless-write" class="headless-write" aria-label="无 Obsidian 连接时的 Vault 写入授权" hidden>
            <div class="headless-copy">
              <strong>Web Vault 写入</strong>
              <span id="headless-status" aria-live="polite">正在核对 Obsidian 与磁盘基线…</span>
              <code id="headless-args-hash" hidden></code>
            </div>
            <div class="headless-actions">
              <button id="headless-request" type="button" hidden>确认 Obsidian 已关闭</button>
              <button id="headless-activate" type="button" hidden>核对并批准一次</button>
              <button id="headless-revoke" type="button" class="deny" hidden>撤销</button>
            </div>
          </section>
          <textarea id="prompt" rows="3" maxlength="1048576" placeholder="询问工作区内容，或交给 OfferAgent 一个任务…"></textarea>
          <section class="write-intent" aria-label="本轮 Vault 写完成要求">
            <label class="write-intent-toggle">
              <input id="write-required" type="checkbox">
              本轮必须产生目标 Vault 写结果
            </label>
            <textarea id="write-target-paths" rows="2" maxlength="20480"
              aria-label="本轮必须写入的 Vault 目标路径"
              placeholder="目标 Vault 路径（每行一个，例如 notes/offer.md）" hidden></textarea>
          </section>
          <div class="composer-actions">
            <select id="permission" aria-label="权限模式">
              <option value="read-only">只读</option>
              <option value="normal" selected>标准</option>
              <option value="trusted-workspace">受信任工作区</option>
              <option value="plan">仅规划</option>
            </select>
            <button id="steer" type="button" disabled>调整进行中的 Run</button>
            <button id="cancel" type="button" disabled>取消</button>
            <button id="send" type="submit">发送</button>
          </div>
        </form>
      </section>
      <aside id="inspector" class="inspector" hidden></aside>
    </main>
  </div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
